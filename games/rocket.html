<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Neon Drift // Space Shooter</title>
  <link rel="icon" type="image/svg+xml" href="./rocket-icon.svg">
  <style>
    :root { color-scheme: dark; --cyan:#55f5ff; --pink:#ff4fbb; --yellow:#ffe66d; --ink:#050914; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; overflow:hidden; background:var(--ink); }
    body { display:grid; place-items:center; color:#eafcff; font-family:"Trebuchet MS","Segoe UI",sans-serif; }
    .game-shell { position:relative; width:min(100vw,1100px); height:min(100vh,760px); min-height:480px; overflow:hidden; border:1px solid #21435c; background:#070d1c; box-shadow:0 0 45px #071d35; }
    canvas { display:block; width:100%; height:100%; cursor:crosshair; }
    .hud { position:absolute; inset:0 0 auto; display:flex; justify-content:space-between; gap:16px; padding:20px 24px; pointer-events:none; text-transform:uppercase; letter-spacing:.14em; }
    .brand { color:var(--cyan); font-size:12px; text-shadow:0 0 12px var(--cyan); }
    .stats { display:flex; gap:24px; color:#9cb0c8; font-size:11px; text-align:right; }
    .stats strong { display:block; margin-top:4px; color:#fff; font-size:20px; letter-spacing:.04em; text-shadow:0 0 10px var(--cyan); }
    .status,.credit { position:absolute; bottom:20px; color:#7190a9; font-size:10px; letter-spacing:.12em; pointer-events:none; }
    .status { left:24px; }.credit { right:24px; }
    .pause-button { position:absolute; top:76px; right:24px; z-index:3; display:none; padding:9px 13px; border:1px solid #55f5ff88; border-radius:8px; background:#0b2638cc; color:var(--cyan); font: bold 11px monospace; letter-spacing:.12em; cursor:pointer; }
    .pause-button.visible { display:block; }
    .mobile-controls { display:none; }
    .control-pad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,48px); gap:5px; }
    .control-button { border:1px solid #55f5ff88; border-radius:10px; background:#0b2638bb; color:var(--cyan); font:bold 22px monospace; box-shadow:0 0 14px #55f5ff22; touch-action:none; user-select:none; }
    .control-button:active,.control-button.active { background:#55f5ff44; box-shadow:0 0 18px #55f5ff88; }
    .control-up{grid-column:2;grid-row:1}.control-left{grid-column:1;grid-row:2}.control-down{grid-column:2;grid-row:2}.control-right{grid-column:3;grid-row:2}
    .fire-button { width:94px; height:94px; border-color:#ff4fbb99; border-radius:50%; color:var(--pink); background:#35152fbb; font-size:13px; letter-spacing:.12em; }
    .fire-button:active,.fire-button.active { background:#ff4fbb55; box-shadow:0 0 22px #ff4fbb99; }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:24px; background:#030712b8; backdrop-filter:blur(4px); text-align:center; }
    .overlay.hidden { display:none; }.panel { max-width:490px; padding:36px 34px; border:1px solid #2a7184; background:#050e1fe6; box-shadow:0 0 30px #20edff1f; }
    h1 { margin:0 0 10px; color:var(--cyan); font-size:clamp(30px,6vw,62px); line-height:.95; letter-spacing:.12em; text-shadow:0 0 8px var(--cyan),0 0 28px #17818d; }
    .panel p { margin:12px 0; color:#9db6cb; font-size:13px; letter-spacing:.12em; line-height:1.6; }.prompt { margin-top:26px!important; color:var(--yellow)!important; animation:pulse 1.4s ease-in-out infinite; }.accent{color:var(--pink)}
    @keyframes pulse { 50%{opacity:.42} }
    @media (max-width:600px) {
      .game-shell { width:100vw; height:100dvh; min-height:0; border:0; }
      .hud { padding:16px; }.brand{font-size:10px}.stats{gap:10px}.stats strong{font-size:16px}.pause-button{top:58px;right:16px}.status{left:16px;bottom:12px;font-size:8px}.credit{right:16px;bottom:12px;font-size:8px}
      .mobile-controls { position:absolute; inset:auto 16px 34px; display:flex; justify-content:space-between; align-items:end; z-index:2; pointer-events:none; }.mobile-controls>*{pointer-events:auto}
    }
    @media (max-height:560px) and (max-width:700px) { .mobile-controls{bottom:12px}.status,.credit{display:none} }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Neon Drift space shooter">
    <canvas id="game" aria-label="Playable space shooter canvas"></canvas>
    <div class="hud"><div class="brand">NEON DRIFT // SECTOR 07</div><div class="stats"><div>SCORE<strong id="score">000000</strong></div><div>WAVE<strong id="wave">01</strong></div><div>HULL<strong id="hull">03</strong></div></div></div>
    <button id="pauseButton" class="pause-button" type="button" aria-label="Pause game">PAUSE</button>
    <div id="status" class="status">ARROWS MOVE &nbsp;//&nbsp; SPACE FIRE &nbsp;//&nbsp; MOUSE AIM</div><div class="credit">DESIGNED BY MJ</div>
    <div class="mobile-controls" aria-label="Touch controls"><div class="control-pad"><button class="control-button control-up" data-key="ArrowUp" aria-label="Move up">▲</button><button class="control-button control-left" data-key="ArrowLeft" aria-label="Move left">◀</button><button class="control-button control-down" data-key="ArrowDown" aria-label="Move down">▼</button><button class="control-button control-right" data-key="ArrowRight" aria-label="Move right">▶</button></div><button class="control-button fire-button" aria-label="Fire">FIRE</button></div>
    <section id="overlay" class="overlay"><div class="panel"><h1 id="title">NEON<br>DRIFT</h1><p id="message">A hostile asteroid belt is closing in.<br>Keep the signal alive.</p><p id="prompt" class="prompt">PRESS SPACE OR CLICK TO LAUNCH</p></div></section>
  </main>
  <script>
  (() => {
    "use strict";
    const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),shell=document.querySelector(".game-shell"),overlay=document.getElementById("overlay"),title=document.getElementById("title"),message=document.getElementById("message"),prompt=document.getElementById("prompt"),pauseButton=document.getElementById("pauseButton"),scoreEl=document.getElementById("score"),waveEl=document.getElementById("wave"),hullEl=document.getElementById("hull");
    const keys=new Set(),bullets=[],enemies=[],particles=[],stars=[]; let width=0,height=0,last=0,spawn=0,waveClock=0,score=0,wave=1,running=false,paused=false,gameOver=false,mouse={x:0,y:0,active:false};
    const player={x:0,y:0,angle:-Math.PI/2,speed:310,cooldown:0,hull:3,invulnerable:0};
    const random=(a,b)=>a+Math.random()*(b-a),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    function resize(){const r=Math.min(devicePixelRatio||1,2),b=shell.getBoundingClientRect();width=b.width;height=b.height;canvas.width=width*r;canvas.height=height*r;ctx.setTransform(r,0,0,r,0,0);if(!player.x){player.x=width/2;player.y=height*.72;mouse.x=width/2;mouse.y=height/2}createStars()}
    function createStars(){stars.length=0;for(let i=0;i<105;i++)stars.push({x:Math.random()*width,y:Math.random()*height,size:random(.4,1.8),speed:random(3,15),alpha:random(.22,.8)})}
    function updateHud(){scoreEl.textContent=String(score).padStart(6,"0");waveEl.textContent=String(wave).padStart(2,"0");hullEl.textContent=String(Math.max(0,player.hull)).padStart(2,"0")}
    function burst(x,y,color,n=12){for(let i=0;i<n&&particles.length<180;i++){const a=Math.random()*Math.PI*2,s=random(35,180);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:random(.25,.7),color})}}
    function reset(){score=0;wave=1;spawn=0;waveClock=0;bullets.length=0;enemies.length=0;particles.length=0;player.x=width/2;player.y=height*.72;player.angle=-Math.PI/2;player.hull=3;player.cooldown=0;player.invulnerable=0;running=true;paused=false;gameOver=false;overlay.classList.add("hidden");pauseButton.classList.add("visible");updateHud();enterFullscreen()}
    function enterFullscreen(){if(window.matchMedia("(max-width: 600px)").matches&&!document.fullscreenElement&&shell.requestFullscreen)shell.requestFullscreen().catch(()=>{})}
    function exitFullscreen(){if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}
    function togglePause(){if(!running||gameOver)return;paused=!paused;pauseButton.textContent=paused?"RESUME":"PAUSE";if(paused){title.textContent="PAUSED";message.textContent="The signal is on hold.";prompt.textContent="PRESS P OR TAP RESUME";overlay.classList.remove("hidden")}else overlay.classList.add("hidden")}
    function endGame(){running=false;gameOver=true;paused=false;pauseButton.classList.remove("visible");title.textContent="SIGNAL LOST";message.innerHTML='Final score: <strong class="accent">'+String(score).padStart(6,"0")+"</strong>";prompt.textContent="PRESS SPACE OR CLICK TO RESTART";overlay.classList.remove("hidden");exitFullscreen()}
    function fire(){if(!running||paused||player.cooldown>0||bullets.length>=36)return;player.cooldown=.16;const a=player.angle;bullets.push({x:player.x+Math.cos(a)*18,y:player.y+Math.sin(a)*18,vx:Math.cos(a)*650,vy:Math.sin(a)*650,life:1.1})}
    function spawnEnemy(){if(enemies.length>=26)return;const edge=Math.floor(Math.random()*4),p=edge===0?{x:random(0,width),y:-35}:edge===1?{x:width+35,y:random(0,height)}:edge===2?{x:random(0,width),y:height+35}:{x:-35,y:random(0,height)},size=random(16,29),a=Math.atan2(player.y-p.y,player.x-p.x)+random(-.65,.65);enemies.push({...p,size,radius:size*.8,vx:Math.cos(a)*random(35,70+wave*5),vy:Math.sin(a)*random(35,70+wave*5),rotation:0,spin:random(-2,2)})}
    function update(dt){waveClock+=dt;spawn-=dt;player.cooldown-=dt;player.invulnerable-=dt;if(waveClock>18){wave++;waveClock=0;updateHud()}if(spawn<=0){spawnEnemy();spawn=Math.max(.34,1.15-wave*.045)}let mx=(keys.has("ArrowRight")?1:0)-(keys.has("ArrowLeft")?1:0),my=(keys.has("ArrowDown")?1:0)-(keys.has("ArrowUp")?1:0),len=Math.hypot(mx,my)||1;player.x=Math.max(22,Math.min(width-22,player.x+mx/len*player.speed*dt));player.y=Math.max(44,Math.min(height-26,player.y+my/len*player.speed*dt));if(mouse.active)player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);if(keys.has(" "))fire();stars.forEach(s=>{s.y+=s.speed*dt;if(s.y>height){s.y=0;s.x=Math.random()*width}});for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0)bullets.splice(i,1)}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.x+=e.vx*dt;e.y+=e.vy*dt;e.rotation+=e.spin*dt;if(e.x<-50)e.x=width+50;if(e.x>width+50)e.x=-50;if(e.y<-50)e.y=height+50;if(e.y>height+50)e.y=-50;for(let j=bullets.length-1;j>=0;j--)if(distance(e,bullets[j])<e.radius+4){bullets.splice(j,1);enemies.splice(i,1);score+=100;burst(e.x,e.y,"#ff4fbb",14);updateHud();break}if(enemies[i]&&distance(e,player)<e.radius+15){enemies.splice(i,1);if(player.invulnerable<=0){player.hull--;player.invulnerable=1.6;burst(player.x,player.y,"#55f5ff",24);updateHud();if(player.hull<=0)endGame()}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;if(p.life<=0)particles.splice(i,1)}}
    function draw(){ctx.fillStyle="#070d1c";ctx.fillRect(0,0,width,height);ctx.fillStyle="#9bdfff";stars.forEach(s=>{ctx.globalAlpha=s.alpha;ctx.fillRect(s.x,s.y,s.size,s.size)});ctx.globalAlpha=1;bullets.forEach(b=>{ctx.fillStyle="#ffe66d";ctx.shadowBlur=12;ctx.shadowColor="#ffe66d";ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill()});ctx.shadowBlur=0;enemies.forEach(e=>{ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rotation);ctx.strokeStyle="#ff4fbb";ctx.shadowBlur=14;ctx.shadowColor="#ff4fbb";ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=e.size*(i%2?.72:1);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.stroke();ctx.restore()});if(!(player.invulnerable>0&&Math.floor(player.invulnerable*12)%2===0)){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle+Math.PI/2);ctx.fillStyle="#55f5ff";ctx.shadowBlur=16;ctx.shadowColor="#55f5ff";ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(12,14);ctx.lineTo(0,8);ctx.lineTo(-12,14);ctx.closePath();ctx.fill();ctx.restore()}particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,2,2)});ctx.globalAlpha=1}
    function frame(t){const dt=Math.min((t-last)/1000||0,.033);last=t;if(running&&!paused)update(dt);draw();requestAnimationFrame(frame)}
    function pointer(e){const b=canvas.getBoundingClientRect();mouse.x=e.clientX-b.left;mouse.y=e.clientY-b.top;mouse.active=true}
    window.addEventListener("resize",resize);window.addEventListener("keydown",e=>{keys.add(e.key);if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==="p")togglePause();if(e.key===" "&&!running)reset()});window.addEventListener("keyup",e=>keys.delete(e.key));canvas.addEventListener("pointermove",pointer);canvas.addEventListener("pointerdown",e=>{pointer(e);if(!running)reset();else if(!paused)fire()});pauseButton.addEventListener("click",togglePause);overlay.addEventListener("pointerdown",()=>{if(paused)togglePause();else if(!running)reset()});document.querySelectorAll("[data-key]").forEach(b=>{const k=b.dataset.key;b.addEventListener("pointerdown",e=>{e.preventDefault();keys.add(k);b.classList.add("active");b.setPointerCapture(e.pointerId)});["pointerup","pointercancel"].forEach(type=>b.addEventListener(type,()=>{keys.delete(k);b.classList.remove("active")}))});const fireButton=document.querySelector(".fire-button");fireButton.addEventListener("pointerdown",e=>{e.preventDefault();if(!running)reset();else fireButton.classList.add("active");keys.add(" ")});["pointerup","pointercancel"].forEach(type=>fireButton.addEventListener(type,()=>{keys.delete(" ");fireButton.classList.remove("active")}));resize();updateHud();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>

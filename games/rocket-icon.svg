<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Neon Drift rocket</title>
  <desc id="desc">A cyan and pink neon rocket icon</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset=".55" stop-color="#55f5ff"/>
      <stop offset="1" stop-color="#17818d"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe66d"/>
      <stop offset="1" stop-color="#ff4fbb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" transform="rotate(-45 32 32)">
    <path d="M32 7c7 5 12 14 12 24v11l-12 9-12-9V31C20 21 25 12 32 7Z" fill="url(#body)" stroke="#55f5ff" stroke-width="2"/>
    <circle cx="32" cy="28" r="5" fill="#050914" stroke="#ff4fbb" stroke-width="2"/>
    <path d="M20 36 11 40l8 7 5-7M44 36l9 4-8 7-5-7" fill="#ff4fbb" stroke="#ff4fbb" stroke-width="2"/>
    <path d="M25 49c1 7 4 10 7 12 3-2 6-5 7-12l-7 4-7-4Z" fill="url(#flame)"/>
  </g>
</svg>
